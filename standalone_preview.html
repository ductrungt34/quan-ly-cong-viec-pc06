    // --- 2. UTILS ---
    function getTodayDateString() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function formatDateVN(dateStr) {
      if (!dateStr) return '—';
      const parts = dateStr.split('-');
      if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
      return dateStr;
    }

    function calculateDaysRemaining(deadlineStr, currentStr = getTodayDateString()) {
      if (!deadlineStr) return null;
      const dl = new Date(deadlineStr);
      dl.setHours(23, 59, 59, 999);
      const cur = new Date(currentStr);
      cur.setHours(0, 0, 0, 0);
      return Math.ceil((dl - cur) / (1000 * 60 * 60 * 24));
    }

    function computeDocumentStatus(doc, currentStr = getTodayDateString()) {
      if (doc.isTrackingOnly || !doc.deadlineDate) {
        return { status: 'Đang theo dõi', badgeClass: 'bg-slate-100 text-slate-800 border-slate-300 font-medium', daysRemaining: null };
      }
      const hasResult = Boolean((doc.resultDocNumber && doc.resultDocNumber.trim()) || (doc.resultExcerpt && doc.resultExcerpt.trim()));
      if (hasResult) {
        return { status: 'Đã hoàn thành', badgeClass: 'bg-emerald-100 text-emerald-950 border-emerald-300 font-semibold', daysRemaining: null };
      }
      const days = calculateDaysRemaining(doc.deadlineDate, currentStr);
      if (days < 0) {
        return { status: 'Đã hết hạn', badgeClass: 'bg-rose-100 text-rose-950 border-rose-300 font-bold', daysRemaining: days };
      } else if (days <= 3) {
        return { status: 'Sắp hết hạn', badgeClass: 'bg-amber-100 text-amber-950 border-amber-400 font-bold', daysRemaining: days };
      } else {
        return { status: 'Đang xử lý', badgeClass: 'bg-blue-100 text-blue-950 border-blue-300 font-medium', daysRemaining: days };
      }
    }

    function getGradeFromPercentage(percentage) {
      const p = Math.round(Number(percentage) || 0);
      if (p >= 90) {
        return {
          grade: 'Loại A (Xuất sắc)',
          shortGrade: 'Loại A',
          badgeClass: 'bg-emerald-100 text-emerald-950 border-emerald-300 font-bold'
        };
      } else if (p >= 80) {
        return {
          grade: 'Loại B (Tốt)',
          shortGrade: 'Loại B',
          badgeClass: 'bg-blue-100 text-blue-950 border-blue-300 font-semibold'
        };
      } else if (p >= 70) {
        return {
          grade: 'Loại C (Hoàn thành)',
          shortGrade: 'Loại C',
          badgeClass: 'bg-amber-100 text-amber-950 border-amber-300 font-medium'
        };
      } else {
        return {
          grade: 'Loại D (Cần đôn đốc)',
          shortGrade: 'Loại D',
          badgeClass: 'bg-rose-100 text-rose-950 border-rose-300 font-bold'
        };
      }
    }

    function computeTaskOfficerStatus(task, officer, currentStr = getTodayDateString()) {
      const officerId = typeof officer === 'string' ? officer : officer?.id;

      // Xác định danh sách xã được giao cho cán bộ này trong nhiệm vụ (tất cả hoặc 1 số xã)
      let assignedCommunes = [];
      if (task.assignedCommunes && task.assignedCommunes[officerId]) {
        assignedCommunes = task.assignedCommunes[officerId];
      } else if (typeof officer === 'object') {
        assignedCommunes = officer.communes || [];
      }

      const sub = task.submissions?.[officerId];
      const isPast = calculateDaysRemaining(task.deadline, currentStr) < 0;

      let communeBreakdown = {};
      let completedCommunesCount = 0;
      let inProgressCommunesCount = 0;
      let notStartedCommunesCount = 0;

      if (assignedCommunes.length > 0) {
        assignedCommunes.forEach(cName => {
          const cData = sub?.communeResults?.[cName];
          let cStatus = cData?.status;
          if (!cStatus) {
            cStatus = sub?.urgingStatus || 'Chưa đôn đốc';
            if (cStatus === 'Đã đôn đốc / Hoàn thành') cStatus = 'Đã hoàn thành';
          }
          if (cStatus === 'Đã hoàn thành' || cStatus === 'Đã đôn đốc / Hoàn thành') {
            completedCommunesCount++;
            communeBreakdown[cName] = { status: 'Đã hoàn thành', notes: cData?.notes || '' };
          } else if (cStatus === 'Đang thực hiện') {
            if (isPast) {
              communeBreakdown[cName] = { status: 'Chưa đôn đốc', notes: cData?.notes || 'Quá hạn chưa hoàn thành' };
            } else {
              inProgressCommunesCount++;
              communeBreakdown[cName] = { status: 'Đang thực hiện', notes: cData?.notes || '' };
            }
          } else {
            notStartedCommunesCount++;
            communeBreakdown[cName] = { status: 'Chưa đôn đốc', notes: '' };
          }
        });
      }

      const isAllDone = assignedCommunes.length > 0 && completedCommunesCount === assignedCommunes.length;

      // 1. Đã hoàn thành
      if (isAllDone || (sub && (sub.urgingStatus === 'Đã đôn đốc / Hoàn thành' || sub.urgingStatus === 'Đã hoàn thành'))) {
        return {
          status: 'Đã hoàn thành',
          badgeClass: 'bg-emerald-100 text-emerald-950 border-emerald-300 font-semibold',
          submission: sub,
          communeBreakdown,
          completedCommunesCount: assignedCommunes.length,
          totalCommunesCount: assignedCommunes.length,
          isLocked: false,
          isOverdueNotUrged: false
        };
      }

      // 2. Quá hạn mà không đôn đốc hoặc chưa xong -> Khóa cập nhật, trạng thái "Chưa đôn đốc"
      if (isPast) {
        return {
          status: 'Chưa đôn đốc',
          badgeClass: 'bg-rose-100 text-rose-950 border-rose-300 font-bold',
          submission: sub,
          isLocked: true,
          isOverdueNotUrged: true,
          communeBreakdown,
          completedCommunesCount,
          totalCommunesCount: assignedCommunes.length
        };
      }

      // 3. Đang thực hiện trong hạn
      if (sub && (sub.urgingStatus === 'Đang thực hiện' || inProgressCommunesCount > 0 || completedCommunesCount > 0)) {
        return {
          status: 'Đang thực hiện',
          badgeClass: 'bg-blue-100 text-blue-950 border-blue-300 font-medium',
          submission: sub,
          isLocked: false,
          isOverdueNotUrged: false,
          communeBreakdown,
          completedCommunesCount,
          totalCommunesCount: assignedCommunes.length
        };
      }

      // 4. Chưa đôn đốc trong hạn
      return {
        status: 'Chưa đôn đốc',
        badgeClass: 'bg-slate-100 text-slate-800 border-slate-300 font-medium',
        submission: sub,
        isLocked: false,
        isOverdueNotUrged: false,
        communeBreakdown,
        completedCommunesCount: 0,
        totalCommunesCount: assignedCommunes.length
      };
    }

    // --- 3. MAIN APPLICATION ---

      // Handlers
      const handleSaveDoc = (newDoc) => {

      // Filtered Docs
      const filteredDocs = useMemo(() => {

          const s = computeDocumentStatus(doc).status;

          if (searchTerm) {
            const term = searchTerm.toLowerCase();

              doc.excerpt.toLowerCase().includes(term) ||
              officer.name.toLowerCase().includes(term) ||
              (doc.resultDocNumber && doc.resultDocNumber.toLowerCase().includes(term));

          if (filterStatus !== 'all' && s !== filterStatus) return false;
          if (startDate && doc.docDate < startDate) return false;

      const exportCSV = () => {

          const off = OFFICERS.find(o => o.id === d.officerId)?.name || '';

        });
        const content = '\uFEFF' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
        const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);

      const dashboardTasks = useMemo(() => {
        return tasks.filter(task => {
          const tDate = task.createdAt || task.deadline;
          if (customStartDate && tDate < customStartDate) return false;
          if (customEndDate && tDate > customEndDate) return false;
          return true;
        });
      }, [tasks, customStartDate, customEndDate]);

      // TÍNH TOÁN ĐÁNH GIÁ VÀ XẾP HẠNG 21 CÁN BỘ THEO TỈ LỆ PHẦN TRĂM (%) VÀ LOẠI A/B/C/D
      const evaluatedOfficers = useMemo(() => {
        const areaOfficers = OFFICERS.filter(o => o.role === 'user');
        return areaOfficers.map(officer => {
          // 1) THAM MƯU:
          const myDocs = dashboardDocs.filter(d => d.officerId === officer.id);
          let docsDone = 0;
          let docsOverdue = 0;
          myDocs.forEach(d => {
            const s = computeDocumentStatus(d).status;
            if (s === 'Đã hoàn thành') docsDone++;
            else if (s === 'Đã hết hạn') docsOverdue++;
          });
          const advisoryRate = myDocs.length > 0 ? Math.round((docsDone / myDocs.length) * 100) : 100;
          const advisoryGradeObj = getGradeFromPercentage(advisoryRate);

          // 2) ĐÔN ĐỐC XÃ:
          let tasksAssigned = 0;
          let tasksDone = 0;
          let tasksOverdue = 0;
          let totalCommunesDone = 0;
          let totalCommunesAssigned = 0;

          dashboardTasks.forEach(task => {
            const isAssigned = task.assignedToAll || task.assignedOfficers?.includes(officer.id);
            if (isAssigned) {
              tasksAssigned++;
              const stInfo = computeTaskOfficerStatus(task, officer);
              if (stInfo.status === 'Đã hoàn thành') tasksDone++;
              if (stInfo.isOverdueNotUrged) tasksOverdue++;
              totalCommunesDone += stInfo.completedCommunesCount || 0;
              totalCommunesAssigned += stInfo.totalCommunesCount || 0;
            }
          });

          let urgingRate = 100;
          if (totalCommunesAssigned > 0) {
            urgingRate = Math.round((totalCommunesDone / totalCommunesAssigned) * 100);
          } else if (tasksAssigned > 0) {
            urgingRate = Math.round((tasksDone / tasksAssigned) * 100);
          }
          const urgingGradeObj = getGradeFromPercentage(urgingRate);

          // 3) CHUNG (Tỉ lệ % trung bình cả 2 mặt)
          const overallRate = Math.round((advisoryRate + urgingRate) / 2);
          const overallGradeObj = getGradeFromPercentage(overallRate);

            ...officer,
            myDocsCount: myDocs.length,
            docsDone,
            docsOverdue,
            advisoryRate,
            advisoryGrade: advisoryGradeObj.grade,
            advisoryBadge: advisoryGradeObj.badgeClass,

            tasksOverdue,

            urgingBadge: urgingGradeObj.badgeClass,
            overallRate,
            overallGrade: overallGradeObj.grade,
            overallBadge: overallGradeObj.badgeClass
          };
        });

      const advisoryRankings = useMemo(() => [...evaluatedOfficers].sort((a, b) => b.advisoryRate - a.advisoryRate), [evaluatedOfficers]);
      const urgingRankings = useMemo(() => [...evaluatedOfficers].sort((a, b) => b.urgingRate - a.urgingRate), [evaluatedOfficers]);

                                            <span className="text-slate-500">Còn {statusInfo.daysRemaining} ngày</span>

                  const percentDone = assignedList.length > 0 ? Math.round((doneCount / assignedList.length) * 100) : 0;
                  const currentUserAssigned = task.assignedToAll || task.assignedOfficers?.includes(currentUser.id);

                                {isPast ? `Quá hạn ${Math.abs(daysRemaining)} ngày` : `Hạn chót: ${formatDateVN(task.deadline)} (Còn ${daysRemaining} ngày)`}

                              <span className="text-[10px] font-semibold px-2 py-0.5 rounded bg-slate-100 text-slate-700 border border-slate-200">
                                👥 {task.assignedToAll ? 'Giao tất cả 21 cán bộ' : `Giao ${assignedList.length} cán bộ chỉ định`}
                              </span>
                            </div>
                            <h3 className="text-base font-bold text-slate-900 mt-1">{task.title}</h3>
                            <p className="text-xs text-slate-600 line-clamp-2">{task.content}</p>
                          </div>

                          {/* ACTION BUTTONS & TOGGLE CHI TIẾT */}
                          <div className="flex flex-wrap items-center gap-2 flex-shrink-0">
                            {currentUser.role === 'user' && currentUserAssigned && (
                              myStatus.isLocked ? (
                                <span className="px-3 py-1.5 bg-rose-50 text-rose-800 border border-rose-300 rounded-lg text-xs font-bold flex items-center gap-1 shadow-xs">
                                  🔒 Quá hạn (Đã khóa)
                                </span>
                              ) : (
                                <button
                                  onClick={() => { setSubTask(task); setSubOfficerId(currentUser.id); setIsSubModalOpen(true); }}
                                  className="px-3.5 py-1.5 bg-[#143e21] hover:bg-[#1a4e2a] text-amber-300 text-xs font-bold rounded-lg shadow transition-colors flex items-center gap-1"
                                >
                                  📝 Cập Nhật Đôn Đốc
                                </button>
                              )
                            )}

                              onClick={() => setExpandedTaskIds(prev => ({ ...prev, [task.id]: !prev[task.id] }))}

                                  ? 'bg-[#143e21] text-amber-300 border-[#143e21] shadow-xs'

                                }`}
                            >
                              {isExpanded ? '▲ Thu Gọn Bảng' : `👁️ Xem Chi Tiết Tiến Độ (${assignedList.length} CB)`}

                            <span className="text-[11px] font-semibold text-slate-700 whitespace-nowrap">
                              Tiến độ: <strong>{doneCount}/{assignedList.length}</strong> cán bộ hoàn thành ({percentDone}%)
                            </span>
                            <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden border border-slate-200">
                              <div className="bg-emerald-600 h-full rounded-full transition-all" style={{ width: `${percentDone}%` }}></div>
                            </div>
                          </div>

                              <thead>
                                <tr className="bg-[#143e21] text-white font-semibold">

                                  <th className="p-2 min-w-[150px]">Cán Bộ Phụ Trách</th>

                                  const breakdown = stInfo.communeBreakdown || {};

                                  const assignedCommunes = task.assignedCommunes?.[officer.id] || officer.communes || [];

                                      <td className="p-2">
                                        <div className="font-bold text-slate-800">{officer.name} {isMe ? '(Bạn)' : ''}</div>

                                                    : isInProg
                                                      ? 'bg-blue-100 text-blue-950 border-blue-300'
                                                      : 'bg-slate-100 text-slate-600 border-slate-200'
                                                  }`}
                                              >
                                                {cName}: {isDone ? '✓ Xong' : isInProg ? 'Đang làm' : 'Chưa'}
                                              </span>
                                            );
                                          })}
                                        </div>
                                      </td>
                                      <td className="p-2 text-center">
                                        <span className={`px-2 py-0.5 rounded-full border text-[11px] ${stInfo.badgeClass}`}>
                                          {stInfo.status}
                                        </span>
                                        {stInfo.isLocked && (
                                          <span className="block text-[10px] text-red-600 font-bold mt-0.5">
                                            (Quá hạn - Đã khóa)
                                          </span>
                                        )}
                                      </td>
                                      <td className="p-2 text-slate-700 text-[11px]">
                                        {stInfo.submission?.notes ? (
                                          <p className="line-clamp-2 italic text-slate-800">{stInfo.submission.notes}</p>
                                        ) : (
                                          <span className="text-slate-400 italic">Chưa có báo cáo đôn đốc</span>
                                        )}
                                        {stInfo.submission?.attachmentName && (
                                          <span className="text-blue-700 block font-mono text-[10px] mt-0.5">
                                            📎 {stInfo.submission.attachmentName}
                                          </span>
                                        )}
                                      </td>
                                      <td className="p-2 text-center whitespace-nowrap">
                                        {stInfo.isLocked && !isAdmin ? (
                                          <span className="text-slate-400 italic text-[11px]">🔒 Đã khóa</span>
                                        ) : (isAdmin || isMe) ? (
                                          <button
                                            onClick={() => { setSubTask(task); setSubOfficerId(officer.id); setIsSubModalOpen(true); }}
                                            className="px-2 py-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 font-bold rounded border border-emerald-300 text-xs"
                                          >
                                            {stInfo.submission?.urgingStatus ? 'Sửa' : 'Cập nhật'}
                                          </button>
                                        ) : (
                                          <span className="text-slate-400 text-xs">-</span>
                                        )}
                                      </td>
                                    </tr>
                                  );
                                })}
                              </tbody>
                            </table>
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </main>

          {/* FOOTER - BẢN QUYỀN: ĐẠI ÚY PHẠM ĐỨC TRUNG */}

                <span className="w-2 h-2 rounded-full bg-emerald-600"></span>
                <span>Bản quyền: <strong>Đại úy Phạm Đức Trung - Cán bộ Đội 2 phòng PC06</strong></span>

              <div className="text-slate-400 text-[11px]">
                Hệ thống Quản lý Văn bản & Đánh giá Đôn đốc Công an cấp xã • PC06 Công an TP Hải Phòng
              </div>

                <h3 className="text-base font-bold text-slate-900">{editingDoc ? 'Cập Nhật Văn Bản' : 'Tiếp Nhận Văn Bản Mới'}</h3>
                <div className="space-y-2.5 text-xs">
                  <div>
                    <label className="font-bold block mb-1">Số / Ký hiệu VB *</label>
                    <input id="docNumberInput" defaultValue={editingDoc?.docNumber || ''} className="w-full px-3 py-1.5 border rounded-lg text-sm" placeholder="VD: 142/CATP-PC06" />
                  </div>
                  <div>
                    <label className="font-bold block mb-1">Ngày ban hành VB *</label>
                    <input id="docDateInput" type="date" defaultValue={editingDoc?.docDate || getTodayDateString()} className="w-full px-3 py-1.5 border rounded-lg text-sm" />
                  </div>
                  <div>
                    <label className="font-bold block mb-1">Trích yếu nội dung *</label>
                    <textarea id="excerptInput" rows={2} defaultValue={editingDoc?.excerpt || ''} className="w-full px-3 py-1.5 border rounded-lg text-sm" placeholder="Nội dung tóm tắt..." />
                  </div>
                  <div className="grid grid-cols-2 gap-2">

                                          const isCSelected = selectedForOff.includes(cName);
                                          return (
                                            <button
                                              key={cIdx}
                                              type="button"
                                              onClick={() => {
                                                const updated = isCSelected
                                                  ? selectedForOff.filter(x => x !== cName)
                                                  : [...selectedForOff, cName];
                                                setTaskOfficerCommuneMap(prev => ({ ...prev, [officer.id]: updated }));
                                              }}
                                              className={`px-2 py-0.5 rounded text-[11px] border font-medium transition-all ${isCSelected
                                                  ? 'bg-[#143e21] text-amber-300 border-[#143e21]'
                                                  : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-100'
                                                }`}
                                            >
                                              {isCSelected ? '✓ ' : ''}{cName}
                                            </button>
                                          );
                                        })}
                                      </div>
                                    </div>
                                  )}
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })()}
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-2 border-t">
                  <button onClick={() => setIsTaskModalOpen(false)} className="px-4 py-1.5 border rounded-lg text-xs font-bold text-slate-700">Hủy</button>
                  <button
                    onClick={() => {
                      const t = document.getElementById('taskTitle').value.trim();
                      const c = document.getElementById('taskContent').value.trim();
                      const cat = document.getElementById('taskCat').value;
                      const dl = document.getElementById('taskDl').value;
                      if (!t || !c || !dl) { alert('Vui lòng điền đủ Tiêu đề, Nội dung và Hạn chót'); return; }

                      const areaOfficers = OFFICERS.filter(o => o.role === 'user');
                      const assignedOfficersList = taskAssignScope === 'all'
                        ? areaOfficers
                        : areaOfficers.filter(o => taskSelectedOfficers.includes(o.id));

                      if (assignedOfficersList.length === 0) {
                        alert('Vui lòng chọn ít nhất một cán bộ địa bàn phụ trách');
                        return;
                      }

                      // Bản đồ phân công xã cụ thể
                      const finalCommuneMap = {};
                      for (const off of assignedOfficersList) {
                        if (taskCommuneScope === 'all_communes') {
                          finalCommuneMap[off.id] = [...off.communes];
                        } else {
                          const curSelected = taskOfficerCommuneMap[off.id] !== undefined ? taskOfficerCommuneMap[off.id] : [...off.communes];
                          if (curSelected.length === 0) {
                            alert(`Đồng chí ${off.name} chưa được chọn xã nào để đôn đốc. Vui lòng chọn ít nhất 1 xã hoặc bỏ chọn đồng chí này.`);
                            return;
                          }
                          finalCommuneMap[off.id] = curSelected;
                        }
                      }

                      handleSaveTask({
                        id: `task_${Date.now()}`,
                        title: t,
                        content: c,
                        category: cat,
                        deadline: dl,
                        assignedToAll: taskAssignScope === 'all',
                        assignedOfficers: assignedOfficersList.map(o => o.id),
                        assignedCommunes: finalCommuneMap,
                        createdAt: getTodayDateString(),
                        createdByName: `${currentUser.position} ${currentUser.name}`,
                        submissions: {}
                      });
                    }}
                    className="px-4 py-1.5 bg-[#143e21] text-amber-300 rounded-lg text-xs font-bold shadow hover:bg-[#1a4e2a]"
                  >
                    Giao Nhiệm Vụ Đôn Đốc
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Category Modal */}
          {isCatModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 bg-slate-900/60 backdrop-blur-xs">
              <div className="bg-white rounded-2xl shadow-xl max-w-md w-full p-5 space-y-3">
                <h3 className="text-base font-bold text-slate-900">Quản Lý Lĩnh Vực Chuyên Môn</h3>
                <div className="space-y-2">
                  <div className="flex gap-2">
                    <input id="newCatName" placeholder="Tên lĩnh vực mới..." className="flex-1 px-3 py-1.5 border rounded-lg text-xs" />
                    <button
                      onClick={() => {
                        const val = document.getElementById('newCatName').value.trim();
                        if (!val) return;
                        if (categories.some(c => c.name.toLowerCase() === val.toLowerCase())) { alert('Lĩnh vực đã có!'); return; }
                        setCategories([...categories, { id: `cat_${Date.now()}`, name: val, colorClass: 'bg-emerald-100 text-emerald-950 border-emerald-300 font-semibold' }]);
                        document.getElementById('newCatName').value = '';
                      }}
                      className="px-3 py-1.5 bg-emerald-700 text-white rounded-lg text-xs font-bold"
                    >
                      Thêm
                    </button>
                  </div>
                  <div className="divide-y max-h-56 overflow-y-auto pt-1">
                    {categories.map(c => (
                      <div key={c.id} className="py-1.5 flex items-center justify-between text-xs">
                        <span className={`px-2 py-0.5 rounded border ${c.colorClass}`}>{c.name}</span>
                        {categories.length > 1 && (
                          <button onClick={() => setCategories(categories.filter(x => x.id !== c.id))} className="text-red-500 hover:underline">Xóa</button>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
                <div className="flex justify-end pt-2 border-t">
                  <button onClick={() => setIsCatModalOpen(false)} className="px-4 py-1.5 bg-slate-800 text-white rounded-lg text-xs font-bold">Đóng</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
